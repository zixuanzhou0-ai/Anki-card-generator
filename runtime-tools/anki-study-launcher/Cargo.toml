[package]
name = "anki-study-launcher"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ed25519-dalek = { version = "3.0.0", default-features = false }
serde_json = "1.0.150"
sha2 = "0.11.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
